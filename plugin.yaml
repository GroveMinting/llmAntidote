name: llm-antidote
version: "3.2.3"
manifest_version: 2
api_version: 1
description: Runtime guardrails, behavioral evaluation, and signed fleet admission for Hermes Agent
author: Grove Minting Company
license: MIT
homepage: https://github.com/GroveMinting/llmAntidote
requires_hermes: ">=0.21.5"
tags: [security, guardrails, provenance, local-models, fleet, admission]
provides_hooks:
  - pre_tool_call
  - post_tool_call
  - pre_api_request
  - on_session_start
  - on_session_reset
  - on_session_finalize
config_schema:
  mode:
    type: str
    choices: [balanced, strict, audit]
    default: balanced
    description: Balanced blocks known exfiltration and requests approval for ambiguous risk.
  taint_ttl_minutes:
    type: int
    default: 60
    description: Minutes that sensitive-read metadata remains active in a session.
  pending_ttl_minutes:
    type: int
    default: 5
    description: Minutes a permitted-but-unresolved sensitive access blocks outbound calls.
  taint_scope:
    type: str
    choices: [egress, egress_persist_shell, all]
    default: egress_persist_shell
    description: Which capabilities a completed sensitive read blocks in a session.
  max_scan_bytes:
    type: int
    default: 1048576
    description: Maximum tool-argument text scanned; larger arguments are refused.
  audit_capacity:
    type: int
    default: 200
    description: Maximum metadata-only decision records retained in memory.
  safe_read_roots:
    type: str
    default: ""
    description: Comma-separated directories where file reads are ordinary. Reads outside require approval.
  sensitive_roots:
    type: str
    default: ""
    description: Comma-separated directories that always require approval to read.
  allow_outbound_tools:
    type: str
    default: ""
    description: Comma-separated tool names the operator explicitly allows to send data out.
  admission_enforcement:
    type: str
    choices: ["", disabled, enforced]
    default: ""
    description: Set to enforced to require a signed fleet policy and verified model binding at startup.
  admission_policy_path:
    type: str
    default: ""
    description: Enforced mode only. Path to the signed fleet policy JSON.
  admission_policy_signature_path:
    type: str
    default: ""
    description: Enforced mode only. Path to the detached policy signature JSON.
  admission_policy_public_key:
    type: str
    default: ""
    description: Enforced mode only. Path to the trusted policy authority public key.
  admission_trusted_policy_sha256:
    type: str
    default: ""
    description: Enforced mode only. Out-of-band trusted policy SHA-256 digest.
  admission_require_model_binding:
    type: str
    choices: ["", "true", "false"]
    default: "true"
    description: Enforced mode only. Require the deployed model to match a verified lockfile.
  admission_require_route_observation:
    type: str
    choices: ["", "true", "false"]
    default: "true"
    description: Enforced mode only. Block tool calls until a pre_api_request confirms the model.
  admission_model_lock_path:
    type: str
    default: ""
    description: Enforced mode only. Path to the admitted model lockfile.
  admission_model_source:
    type: str
    default: ""
    description: Enforced mode only. Deployed model directory to verify against the lockfile.
  admission_model_name:
    type: str
    default: ""
    description: Enforced mode only. Model name Hermes must serve for tool calls to proceed.
