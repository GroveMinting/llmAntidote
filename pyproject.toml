[build-system]
requires = ["setuptools>=69,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-antidote"
version = "3.1.0"
description = "Runtime guardrails, behavioral evaluation, and signed fleet admission for Hermes Agent"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Grove Minting Company"}]
keywords = ["hermes-agent", "llm", "security", "model-provenance", "guardrails", "fleet"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
]
dependencies = ["cryptography>=42"]

# Development tooling is intentionally NOT a [project.optional-dependencies] extra.
# Hermes installs directory plugins into a uv workspace and resolves it with
# `--all-extras`, which would fold a `dev` extra into the host environment and
# conflict with Hermes' own pinned test tooling. Use requirements-dev.txt.

[project.urls]
Homepage = "https://github.com/GroveMinting/llmAntidote"
Issues = "https://github.com/GroveMinting/llmAntidote/issues"

[project.scripts]
llm-antidote = "llm_antidote.standalone:main"

[tool.setuptools.packages.find]
include = ["llm_antidote*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["build", "dist", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
